[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soaring-ctrw"
version = "0.6.0"
description = "Step-based CTRW model with angular persistence for cross-country soaring flights"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Matteo Di Sante" },
]
keywords = [
    "CTRW",
    "anomalous diffusion",
    "soaring flight",
    "Lévy walk",
    "Monte Carlo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pymittagleffler>=0.2",  # Mittag-Leffler median in compute_ml_median_and_tau_turn.py
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
docs = [
    "sphinx>=7.2",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "sphinxcontrib-programoutput>=0.17",
    "interrogate>=1.7",
]

[project.urls]
Homepage = "https://github.com/matteodisante/soaring-ctrw"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "NPY", "RUF"]
ignore = ["N803", "N806"]  # allow short math names (mu, sigma, N)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# Docstring-coverage gate. The docs CI fails if public API docstrings
# fall below ``fail-under``; this is half of the "docs can never go stale"
# guarantee (the other half is the warnings-as-errors Sphinx build).
[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
ignore-private = true            # __double_underscore
ignore-semiprivate = true        # _single_underscore internal helpers
ignore-property-decorators = true  # accessors documented in class docstrings
ignore-module = false
exclude = ["docs", "tests", "build", ".venv"]
verbose = 1
