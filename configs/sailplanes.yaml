# Sailplane configuration -- Table 1 of the manuscript (Di Sante 2026).
# All values are read from or derived from Vilpellet, Darmon & Benzaquen
# (2026, arXiv:2601.01293) following the recipe in the Parameter
# estimation section of the manuscript.
#
#   v_xy        = 35.85 m/s
#   mu_T        = 2.62
#   mu_S        = 2.90
#   tau_0^T     = 500  s
#   tau_0^S     = 75   s
#   mu_C_eff    = 110  s
#   alpha_S     = 0.4
#   tau_b^S     = 10   s
#   u_S         = 28.28 m/s    (short-lag ballistic speed, paper Eq. 4)
#   tau_turn^S  = 9.334 s      (Pillai-ML: pi/(2*Omega_S*m_{1/2}(0.4)))
#   Omega_S     = 0.29 s^-1
#   r0          = 129.9 m
#   T_turn_mean = 25 s
#   T_turn_std  = 30 s
#   v_drift     = 4.34 m/s
#   sigma_theta = 0.35 rad
name: sailplanes
v_xy: 35.85

transition:
  distribution: lomax
  params: {mu: 2.62, tau_0: 500.0}

search:
  distribution: lomax
  params: {mu: 2.90, tau_0: 100.0}

climb:
  distribution: exponential
  params: {tau_mean: 110.0}

angular:
  sigma_theta: null
  theta0: null

search_motion:
  u_S: 28.28          # m/s 
  tau_b_S: 10.0
  tau_turn_S: 9.334  
  alpha_S: 0.4
  Omega_S: 0.29

climb_motion:
  r0: 129.9
  T_turn_mean: 25.0
  T_turn_std: 10.0
  v_drift: 4.34
