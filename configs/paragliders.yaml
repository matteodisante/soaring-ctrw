# Paraglider configuration -- Table 1 of the manuscript (Di Sante 2026).
# All values are read from or derived from Vilpellet, Darmon & Benzaquen
# (2026, arXiv:2601.01293) following the recipe in the Parameter
# estimation section of the manuscript.
#
#   v_xy        = 10.06 m/s    (Fig. 4b, median horizontal speed)
#   mu_T        = 3.93         (Fig. 4c, transition tail exponent)
#   mu_S        = 3.88         (Fig. 4f, search    tail exponent)
#   tau_0^T     = 700  s       (survival-function elbow, Fig. 4c)
#   tau_0^S     = 200  s       (survival-function elbow, Fig. 4f)
#   mu_C_eff    = 110  s       (climb-duration scale, Fig. 4i)
#   alpha_S     = 0.6          (log-log slope of search MSD, Fig. 3a)
#   tau_b^S     = 10   s       (MSD crossover lag, Fig. 3a)
#   u_S         = 8.37 m/s     (short-lag ballistic speed,
#                               u_S ≃ [delta_S^2(1 s)]^{1/2}/(1 s), paper Eq. 4)
#   tau_turn^S  = 9.605 s      (Pillai-ML: pi/(2*Omega_S*m_{1/2}(0.6)),
#                               m_{1/2}=0.6057 from calculate_mit.py)
#   Omega_S     = 0.27 s^-1    (v_xy^25 / R_th^25, Fig. 4b/4h)
#   r0          = 39.0 m       (Fig. 4h, median thermalling radius)
#   T_turn_mean = 60 s
#   T_turn_std  = 35 s         (climb MSD plateau, Fig. 3a)
#   v_drift     = 1.9 m/s      (large-lag climb MSD slope, Fig. 3a)
#   sigma_theta = 0.35 rad     (analytic universal value, phase diagram)
name: paragliders
v_xy: 10.06

transition:
  distribution: lomax
  params: {mu: 3.93, tau_0: 700.0}

search:
  distribution: lomax
  params: {mu: 3.88, tau_0: 200.0}

climb:
  distribution: exponential
  params: {tau_mean: 110.0}

angular:
  sigma_theta: null
  theta0: null   # random uniform on [0, 2*pi) per trajectory

search_motion:
  u_S: 8.37          # m/s   
  tau_b_S: 10.0      # s
  tau_turn_S: 9.605  # s    
  alpha_S: 0.6
  Omega_S: 0.27      # s^-1

climb_motion:
  r0: 39.0           # m
  T_turn_mean: 40.0  # s
  T_turn_std: 10.0   # s
  v_drift: 1.9       # m/s
