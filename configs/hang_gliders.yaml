# Hang-glider configuration -- Table 1 of the manuscript (Di Sante 2026).
# All values are read from or derived from Vilpellet, Darmon & Benzaquen
# (2026, arXiv:2601.01293) following the recipe in the Parameter
# estimation section of the manuscript.
#
#   v_xy        = 15.58 m/s
#   mu_T        = 4.79
#   mu_S        = 2.25
#   tau_0^T     = 600  s
#   tau_0^S     = 150  s
#   mu_C_eff    = 110  s
#   alpha_S     = 0.6
#   tau_b^S     = 10   s
#   u_S         = 13.04 m/s    (short-lag ballistic speed, paper Eq. 4)
#   tau_turn^S  = 9.605 s      (Pillai-ML: pi/(2*Omega_S*m_{1/2}(0.6)))
#   Omega_S     = 0.27 s^-1
#   r0          = 58.1 m
#   T_turn_mean = 60 s
#   T_turn_std  = 35 s
#   v_drift     = 3.59 m/s
#   sigma_theta = 0.35 rad
name: hang_gliders
v_xy: 15.58

transition:
  distribution: lomax
  params: {mu: 4.79, tau_0: 800.0}

search:
  distribution: lomax
  params: {mu: 2.25, tau_0: 150.0}

climb:
  distribution: exponential
  params: {tau_mean: 110.0}

angular:
  sigma_theta: null
  theta0: null

search_motion:
  u_S: 13.04          # m/s  
  tau_b_S: 10.0
  tau_turn_S: 9.605   
  alpha_S: 0.6
  Omega_S: 0.27

climb_motion:
  r0: 58.1
  T_turn_mean: 30.0
  T_turn_std: 10.0
  v_drift: 3.59
